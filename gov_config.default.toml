# BC-250 governor V(f) curve.
#
# Default enabled window: 500..1800 MHz.  350 MHz (below) and every point above
# 1800 MHz are present as set points but DISABLED, so the default governor
# window is exactly 500..1800 MHz.

[[safe-points]]
frequency = 350
voltage = 700
enabled = false

[[safe-points]]
frequency = 500
voltage = 700
enabled = true

