# Per-project configuration for build_ffs.sh.

PKG_DIR="BC250DXEv3MenuDriverPkg"
PLATFORM_DSC="BC250DXEv3MenuDriverPkg/BC250DXEv3MenuDriverPkg.dsc"

# Output subdirectory name under the edk2 Build/ tree.
BUILD_PACKAGE_DIR="BC250DXEv3MenuDriverPkg"

MODULE_NAME="MeiMeiDXEv3MenuDriver"
MODULE_INF="BC250DXEv3MenuDriverPkg/BC250DXEv3MenuDriver/BC250DXEv3MenuDriver.inf"
MODULE_GUID="0ddde9e4-4a0c-4679-bedc-90a37610ab85"

# This driver builds a single module from an INF (with VFR/uni UI). It uses
# only the standard targeted edk2 submodule set; the full recursive update
# fails on upstream's broken SecurityPkg/SpdmLib/mbedtls submodule chain.
# MdeModulePkg.dec additionally requires its own brotli copy.
BUILD_MODULE=1
SUBMODULES_EXTRA="MdeModulePkg/Library/BrotliCustomDecompressLib/brotli"
